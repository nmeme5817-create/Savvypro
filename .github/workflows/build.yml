          cat > $D/Grid.kt <<'EOF'
          package live.savvypro

          import android.graphics.Rect

          object Grid {
              data class Cell(val ch: Char, val box: Rect)

              fun rows(cells: List<Cell>): List<List<Cell>> =
                  cells.groupBy { it.box.centerY() / 45 }.values
                      .map { r -> r.sortedBy { it.box.centerX() } }
                      .filter { it.size in 4..7 }

              fun best(cells: List<Cell>): Pair<Int, List<List<Cell>>>? {
                  val rs = rows(cells)
                  if (rs.isEmpty()) return null
                  val n = rs.groupingBy { it.size }.eachCount().maxByOrNull { it.value }!!.key
                  val keep = rs.filter { it.size == n }
                  if (keep.isEmpty()) return null
                  val w = keep.flatMap { r -> r.map { it.box.width() } }.sorted()
                  val med = w[w.size / 2]
                  val ok = keep.filter { r -> r.all { it.box.width() in (med * 0.5f).toInt()..(med * 1.8f).toInt() } }
                  return if (ok.isEmpty()) null else n to ok
              }
          }
          EOF

          cat > $D/Paint.kt <<'EOF'
          package live.savvypro

          import android.graphics.Bitmap
          import android.graphics.Color

          /** Relative classification: cells are compared to each other, so no fixed thresholds. */
          object Paint {
              private fun hsv(b: Bitmap, x0: Int, y0: Int): FloatArray {
                  var r = 0L; var g = 0L; var bl = 0L; var n = 0
                  for (dx in -9..9) for (dy in -9..9) {
                      val x = (x0 + dx).coerceIn(0, b.width - 1)
                      val y = (y0 + dy).coerceIn(0, b.height - 1)
                      val p = b.getPixel(x, y)
                      r += Color.red(p); g += Color.green(p); bl += Color.blue(p); n++
                  }
                  val out = FloatArray(3)
                  Color.RGBToHSV((r / n).toInt(), (g / n).toInt(), (bl / n).toInt(), out)
                  return out
              }

              fun marks(b: Bitmap, row: List<Grid.Cell>, mult: Float): String {
                  val s = row.map { c -> hsv(b, c.box.centerX(), c.box.centerY()) }
                  val filled = s.filter { it[2] > 0.09f / mult }
                  if (filled.isEmpty()) return "?".repeat(row.size)
                  val med = filled.map { it[1] }.sorted()[filled.size / 2]
                  val sb = StringBuilder()
                  for (v in s) {
                      when {
                          v[2] <= 0.09f / mult -> sb.append('?')
                          v[1] < 0.18f * mult || v[1] < med * 0.6f -> sb.append('x')
                          v[0] < 78f -> sb.append('y')
                          else -> sb.append('g')
                      }
                  }
                  return sb.toString()
              }
          }
          EOF

          cat > $D/Ocr.kt <<'EOF'
          package live.savvypro

          import android.graphics.Bitmap
          import android.graphics.Rect
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions

          object Ocr {
              private val rec by lazy { TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS) }

              fun scan(b: Bitmap, onDone: (List<Grid.Cell>) -> Unit) {
                  val top = (b.height * 0.18f).toInt()
                  val bot = (b.height * 0.82f).toInt()
                  val crop = Bitmap.createBitmap(b, 0, top, b.width, bot - top)

                  rec.process(InputImage.fromBitmap(crop, 0))
                      .addOnSuccessListener { t ->
                          val out = ArrayList<Grid.Cell>()
                          for (bl in t.textBlocks) for (ln in bl.lines) for (e in ln.elements) {
                              val s = e.text.trim()
                              if (s.isEmpty() || !s.all { it.isLetter() }) continue
                              val bb = e.boundingBox ?: continue
                              if (bb.height() !in 14..140) continue
                              if (s.length == 1) {
                                  if (bb.width() in 8..140) out.add(Grid.Cell(s[0].lowercaseChar(),
                                      Rect(bb.left, bb.top + top, bb.right, bb.bottom + top)))
                              } else {
                                  val w = bb.width() / s.length
                                  if (w in 8..140) for (i in s.indices)
                                      out.add(Grid.Cell(s[i].lowercaseChar(), Rect(
                                          bb.left + i * w, bb.top + top,
                                          bb.left + (i + 1) * w, bb.bottom + top)))
                              }
                          }
                          onDone(out)
                      }
                      .addOnFailureListener { onDone(emptyList()) }
              }
          }
          EOF

          cat > $D/A11y.kt <<'EOF'
          package live.savvypro

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class A11y : AccessibilityService() {
              override fun onServiceConnected() { me = this }
              override fun onDestroy() { me = null; super.onDestroy() }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              private fun root(): AccessibilityNodeInfo? {
                  val r = rootInActiveWindow ?: return null
                  return if (r.packageName == GAME) r
                  else windows.firstOrNull { it.root?.packageName == GAME }?.root
              }

              fun letters(): List<Grid.Cell> {
                  val r = root() ?: return emptyList()
                  val o = ArrayList<Grid.Cell>()
                  walk(r, o, 0)
                  return o
              }

              private fun walk(n: AccessibilityNodeInfo?, o: MutableList<Grid.Cell>, d: Int) {
                  if (n == null || d > 40) return
                  val t = (n.text ?: n.contentDescription)?.toString()?.trim()
                  if (!t.isNullOrEmpty() && t.length == 1 && t[0].isLetter()) {
                      val b = Rect(); n.getBoundsInScreen(b)
                      if (b.width() > 12 && b.height() > 12) o.add(Grid.Cell(t[0].lowercaseChar(), b))
                  }
                  for (i in 0 until n.childCount) walk(n.getChild(i), o, d + 1)
              }

              fun tap(label: String): Boolean {
                  val r = root() ?: return false
                  val hit = find(r, label, 0) ?: return false
                  var n: AccessibilityNodeInfo? = hit
                  while (n != null) {
                      if (n.isClickable) return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      n = n.parent
                  }
                  val b = Rect().also { hit.getBoundsInScreen(it) }
                  return tapAt(b.centerX().toFloat(), b.centerY().toFloat())
              }

              private fun find(n: AccessibilityNodeInfo?, l: String, d: Int): AccessibilityNodeInfo? {
                  if (n == null || d > 40) return null
                  if ((n.text ?: n.contentDescription)?.toString()?.trim()?.lowercase() == l.lowercase()) return n
                  for (i in 0 until n.childCount) find(n.getChild(i), l, d + 1)?.let { return it }
                  return null
              }

              fun tapAt(x: Float, y: Float): Boolean {
                  val p = Path().apply { moveTo(x, y) }
                  return dispatchGesture(GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, 40)).build(), null, null)
              }

              companion object {
                  const val GAME = "live.playsavvy.savvy"
                  var me: A11y? = null
              }
          }
          EOF

