          package live.savvypro

          import android.os.Handler
          import android.os.Looper

          object Typer {
              private val h = Handler(Looper.getMainLooper())
              private val GO = listOf("enter", "submit", "guess", "send", "done")

              fun type(w: String, delay: Long, done: () -> Unit) {
                  val s = A11y.me ?: return done()
                  var i = 0
                  fun step() {
                      if (i < w.length) { s.tap(w[i].toString()); i++; h.postDelayed(::step, delay) }
                      else h.postDelayed({ GO.firstOrNull { s.tap(it) }; done() }, 120)
                  }
                  step()
              }
          }
          EOF

          cat > $D/Stats.kt <<'EOF'
          package live.savvypro

          import android.content.Context

          object Stats {
              fun round(c: Context, won: Boolean, guesses: Int, ms: Long) {
                  val p = c.getSharedPreferences("stats", 0)
                  val rounds = p.getInt("rounds", 0) + 1
                  val wins = p.getInt("wins", 0) + (if (won) 1 else 0)
                  val total = p.getInt("total", 0) + guesses
                  val best = if (won) minOf(p.getLong("best", Long.MAX_VALUE), ms) else p.getLong("best", Long.MAX_VALUE)
                  p.edit().putInt("rounds", rounds).putInt("wins", wins)
                      .putInt("total", total).putLong("best", best).apply()
              }
              fun text(c: Context): String {
                  val p = c.getSharedPreferences("stats", 0)
                  val r = p.getInt("rounds", 0)
                  if (r == 0) return "No rounds yet"
                  val w = p.getInt("wins", 0)
                  val avg = p.getInt("total", 0).toFloat() / r
                  val best = p.getLong("best", 0)
                  return "$r rounds · $w won · ${"%.1f".format(avg)} avg · best ${best / 1000}s"
              }
          }
