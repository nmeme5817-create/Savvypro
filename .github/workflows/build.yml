          cat > $D/CaptureService.kt <<'EOF'
          package live.savvypro

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.core.app.NotificationCompat

          class CaptureService : Service() {

              private lateinit var wm: WindowManager
              private var proj: MediaProjection? = null
              private var vd: VirtualDisplay? = null
              private var ir: ImageReader? = null
              private var box: LinearLayout? = null
              private var strip: LinearLayout? = null
              private var line: TextView? = null
              private lateinit var solver: Solver

              private val h = Handler(Looper.getMainLooper())
              private var lastHash = 0
              private var busy = false
              private var scanning = false
              private var running = false
              private var collapsed = false

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  solver = Solver(Words.load(this))
              }

              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  when (i?.action) {
                      OFF -> { stopSelf(); return START_NOT_STICKY }
                      ON -> {
                          note()
                          val code = i.getIntExtra("code", 0)
                          @Suppress("DEPRECATION") val data = i.getParcelableExtra<Intent>("data")
                              ?: return START_NOT_STICKY
                          val m = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                          proj = m.getMediaProjection(code, data)
                          proj?.registerCallback(object : MediaProjection.Callback() {
                              override fun onStop() { stopSelf() }
                          }, h)
                          start()
                          overlay()
                          running = true
                          h.post(::tick)
                      }
                  }
                  return START_STICKY
              }

              private fun note() {
                  val c = NotificationChannel(CH, "Savvy Pro", NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(c)
                  startForeground(1, NotificationCompat.Builder(this, CH)
                      .setContentTitle("Savvy Pro running").setSmallIcon(android.R.drawable.ic_menu_view)
                      .setOngoing(true).build())
              }

              private fun start() {
                  val d = resources.displayMetrics
                  ir = ImageReader.newInstance(d.widthPixels, d.heightPixels, PixelFormat.RGBA_8888, 2)
                  vd = proj?.createVirtualDisplay("sp", d.widthPixels, d.heightPixels, d.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, ir!!.surface, null, h)
              }

              private fun grab(): Bitmap? {
                  val img = ir?.acquireLatestImage() ?: return null
                  return try {
                      val p = img.planes[0]
                      Bitmap.createBitmap(p.rowStride / p.pixelStride, img.height, Bitmap.Config.ARGB_8888)
                          .also { it.copyPixelsFromBuffer(p.buffer) }
                  } finally { img.close() }
              }

              private fun tick() {
                  if (!running) return
                  try { step() } catch (t: Throwable) { say("error " + t.message) }
                  h.postDelayed(::tick, 300)
              }

              private fun step() {
                  if (busy || scanning) return
                  val bmp = grab() ?: return say("no frames")
                  val tree = A11y.me?.letters() ?: emptyList()
                  if (tree.size >= 4 && Grid.best(tree) != null) return run(tree, bmp)
                  scanning = true
                  Ocr.scan(bmp) { c -> scanning = false; run(c, bmp) }
              }

              private fun run(cells: List<Grid.Cell>, bmp: Bitmap) {
                  if (cells.isEmpty()) return say("no letters found")
                  val g = Grid.best(cells) ?: return say("${cells.size} letters, no grid")
                  val n = g.first
                  val grid = g.second.take(6)
                  val mult = prefs().getFloat("tol", 1f)

                  val rows = ArrayList<Solver.Row>()
                  for (r in grid) {
                      val letters = r.joinToString("") { it.ch.toString() }
                      val marks = Paint.marks(bmp, r, mult)
                      if (marks.count { it == 'g' || it == 'y' || it == 'x' } >= n - 1)
                          rows.add(Solver.Row(letters, marks))
                  }
                  if (rows.isEmpty()) return say("waiting for marks")

                  val done = rows.filter { it.marks.any { m -> m != '?' } }
                  val hash = done.joinToString("|") { it.letters + it.marks }.hashCode()
                  val out = solver.solve(done, n, prefs().getInt("mode", 0))
                  if (out.pool == 0) return say("no fit — check board")

                  say("${out.pool} left")
                  show(out.ranked.take(5))
                  if (prefs().getBoolean("auto", false) && out.ranked.isNotEmpty()
                      && hash != lastHash && done.size < 6) {
                      lastHash = hash
                      busy = true
                      Typer.type(out.ranked.first(), prefs().getLong("delay", 85)) { busy = false }
                  }
              }

              private fun overlay() {
                  val b = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16, 10, 16, 12)
                      setBackgroundColor(0xEE0D1117.toInt())
                  }
                  val head = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  head.addView(TextView(this).apply {
                      text = "—"; textSize = 15f; setTextColor(0xFF8FA6BD.toInt())
                      setPadding(0, 0, 16, 0)
                      setOnClickListener { collapsed = !collapsed; strip?.visibility =
                          if (collapsed) LinearLayout.GONE else LinearLayout.VISIBLE }
                  })
                  line = TextView(this).apply { textSize = 11f; setTextColor(0xFF8FA6BD.toInt()) }
                  head.addView(line)
                  strip = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  b.addView(head)
                  b.addView(strip)

                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT).apply { gravity = Gravity.BOTTOM }

                  // drag to move vertically
                  var startY = 0f; var touchY = 0f
                  head.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { startY = p.y; touchY = e.rawY; true }
                          MotionEvent.ACTION_MOVE -> {
                              p.y = (startY - (e.rawY - touchY)).toInt()
                              runCatching { wm.updateViewLayout(b, p) }; true
                          }
                          else -> true
                      }
                  }
                  runCatching { wm.addView(b, p) }
                  box = b
              }

              private fun show(ws: List<String>) {
                  val s = strip ?: return
                  s.removeAllViews()
                  ws.forEachIndexed { i, w ->
                      s.addView(TextView(this).apply {
                          text = w.uppercase()
                          textSize = if (i == 0) 21f else 15f
                          setTextColor(if (i == 0) 0xFFFFFFFF.toInt() else 0xFFCFE3FF.toInt())
                          setPadding(14, 7, 14, 7)
                          setOnClickListener {
                              lastHash = 0; busy = true
                              Typer.type(w, prefs().getLong("delay", 85)) { busy = false }
                          }
                      })
                  }
              }

              private fun say(t: String) { line?.text = t }
              private fun prefs() = getSharedPreferences("bot", MODE_PRIVATE)

              override fun onDestroy() {
                  running = false
                  h.removeCallbacksAndMessages(null)
                  box?.let { runCatching { wm.removeView(it) } }
                  vd?.release(); ir?.close(); proj?.stop()
                  super.onDestroy()
              }

              override fun onBind(i: Intent?) = null

              companion object { const val CH = "sp"; const val ON = "on"; const val OFF = "off" }
          }
          EOF

          cat > $D/MainActivity.kt <<'EOF'
          package live.savvypro

          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var status: TextView
              private lateinit var out: TextView

              private val launch =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      if (r.resultCode == RESULT_OK && r.data != null) {
                          startForegroundService(Intent(this, CaptureService::class.java).apply {
                              action = CaptureService.ON
                              putExtra("code", r.resultCode); putExtra("data", r.data)
                          })
                          status.text = "running — switch to Savvy"
                      }
                  }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val p = getSharedPreferences("bot", MODE_PRIVATE)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(44, 56, 44, 44)
                  }

                  root.addView(TextView(this).apply { text = "Savvy Pro"; textSize = 26f })
                  root.addView(TextView(this).apply {
                      text = "Grant both, then start. Strip appears over the game."
                      textSize = 13f; setPadding(0, 12, 0, 26)
                  })
                  root.addView(Button(this).apply {
                      text = "1. Accessibility"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  root.addView(Button(this).apply {
                      text = "2. Draw over apps"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName"))) }
                  })
                  root.addView(Switch(this).apply {
                      text = "Auto-send"; isChecked = p.getBoolean("auto", false)
                      setPadding(0, 24, 0, 6)
                      setOnCheckedChangeListener { _, v -> p.edit().putBoolean("auto", v).apply() }
                  })
                  root.addView(CheckBox(this).apply {
                      text = "Solve mode (finds the word, fewer placements)"
                      isChecked = p.getInt("mode", 0) == 1
                      setOnCheckedChangeListener { _, v -> p.edit().putInt("mode", if (v) 1 else 0).apply() }
                  })
                  root.addView(TextView(this).apply {
                      text = "Tap delay (ms)"; textSize = 12f; setPadding(0, 14, 0, 0)
                  })
                  root.addView(EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(p.getLong("delay", 85).toString())
                      addTextChangedListener(object : android.text.TextWatcher {
                          override fun afterTextChanged(t: android.text.Editable) {
                              t.toString().toLongOrNull()?.let { p.edit().putLong("delay", it).apply() }
                          }
                          override fun beforeTextChanged(t: CharSequence?, a: Int, b: Int, c: Int) {}
                          override fun onTextChanged(t: CharSequence?, a: Int, b: Int, c: Int) {}
                      })
                  })
                  root.addView(Button(this).apply {
                      text = "Start"; setPadding(0, 26, 0, 0)
                      setOnClickListener {
                          if (A11y.me == null) { status.text = "enable accessibility first"; return@setOnClickListener }
                          if (!Settings.canDrawOverlays(this@MainActivity)) { status.text = "allow overlay first"; return@setOnClickListener }
                          val m = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                          launch.launch(m.createScreenCaptureIntent())
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Stop"
                      setOnClickListener {
                          startService(Intent(this@MainActivity, CaptureService::class.java)
                              .setAction(CaptureService.OFF))
                          status.text = "stopped"
                      }
                  })

                  root.addView(TextView(this).apply {
                      text = "Manual board (e.g. crane gxyxx)"; textSize = 12f; setPadding(0, 30, 0, 4)
                  })
                  val manual = EditText(this).apply { hint = "crane gxyxx" }
                  root.addView(manual)
                  root.addView(Button(this).apply {
                      text = "Solve manually"
                      setOnClickListener {
                          val rows = manual.text.toString().trim().split(" ")
                              .mapNotNull { t ->
                                  if (t.length < 3) null else {
                                      val n = t.length / 2
                                      Solver.Row(t.take(n).lowercase(), t.drop(n).lowercase())
                                  }
                              }
                          if (rows.isEmpty()) { out.text = "nothing to solve"; return@setOnClickListener }
                          val n = rows.first().letters.length
                          val r = Solver(Words.load(this@MainActivity)).solve(rows, n, p.getInt("mode", 0))
                          out.text = if (r.pool == 0) "no fit" else r.ranked.take(8).joinToString("  ")
                      }
                  })
                  out = TextView(this).apply {
                      textSize = 18f; setPadding(0, 12, 0, 0)
                  }
                  root.addView(out)

                  root.addView(TextView(this).apply {
                      text = Stats.text(this@MainActivity); textSize = 12f; setPadding(0, 26, 0, 0)
                  })
                  status = TextView(this).apply { setPadding(0, 14, 0, 0); textSize = 13f }
                  root.addView(status)
                  setContentView(root)
              }
          }
