name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" || true

      - name: Write project
        run: |
          D=app/src/main/java/live/savvypro
          mkdir -p $D app/src/main/res/xml app/src/main/res/values app/src/main/assets

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SavvyPro"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "live.savvypro"
              compileSdk = 35
              defaultConfig {
                  applicationId = "live.savvypro"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 1
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.mlkit:text-recognition:16.0.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:allowBackup="true" android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".CaptureService" android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
                  <service android:name=".A11y" android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/a11y" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Savvy Pro</string>
              <string name="a11y_desc">Reads the Savvy board and taps the keyboard.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/a11y.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="100"
              android:description="@string/a11y_desc" />
          EOF

          cat > $D/Solver.kt <<'EOF'
          package live.savvypro

          class Solver(private val dict: List<String>) {
              data class Row(val letters: String, val marks: String)
              data class Out(val pool: Int, val ranked: List<String>)
              private class C(val g: Array<Char?>, val y: Set<String>, val lo: Map<Char, Int>, val hi: Map<Char, Int>)

              fun solve(rows: List<Row>, n: Int, mode: Int): Out {
                  val c = cons(rows, n)
                  val used = HashSet<Char>()
                  rows.forEach { r -> r.letters.forEach { used.add(it) } }
                  val pool = dict.filter { it.length == n && fits(it, c) }
                  if (pool.isEmpty()) return Out(0, emptyList())
                  return Out(pool.size, rank(pool, used, n, mode))
              }

              private fun cons(rows: List<Row>, n: Int): C {
                  val g = arrayOfNulls<Char>(n)
                  val y = HashSet<String>()
                  val lo = HashMap<Char, Int>()
                  val hi = HashMap<Char, Int>()
                  for (r in rows) {
                      if (r.letters.length != n || r.marks.length != n) continue
                      val ng = HashMap<Char, Int>()
                      for (i in 0 until n) if (r.marks[i] != 'x') {
                          val ch = r.letters[i]; ng[ch] = (ng[ch] ?: 0) + 1
                      }
                      for (i in 0 until n) {
                          val ch = r.letters[i]
                          if (r.marks[i] == 'g') { g[i] = ch; lo[ch] = 1 }
                          else if (r.marks[i] == 'y') { y.add("" + ch + i); lo[ch] = 1 }
                      }
                      for (i in 0 until n) if (r.marks[i] == 'x')
                          hi[r.letters[i]] = minOf(hi[r.letters[i]] ?: 99, ng[r.letters[i]] ?: 0)
                  }
                  for ((ch, v) in lo) { val h = hi[ch] ?: continue; if (h < v) hi[ch] = v }
                  return C(g, y, lo, hi)
              }

              private fun fits(w: String, c: C): Boolean {
                  for (i in w.indices) { val g = c.g[i]; if (g != null && w[i] != g) return false }
                  for (k in c.y) if (w[k.last() - '0'] == k.first()) return false
                  val cnt = HashMap<Char, Int>()
                  for (ch in w) cnt[ch] = (cnt[ch] ?: 0) + 1
                  for ((ch, v) in c.lo) if ((cnt[ch] ?: 0) < v) return false
                  for ((ch, v) in c.hi) if ((cnt[ch] ?: 0) > v) return false
                  return true
              }

              private fun rank(pool: List<String>, used: Set<Char>, n: Int, mode: Int): List<String> {
                  val pf = Array(n) { HashMap<Char, Int>() }
                  val lf = HashMap<Char, Int>()
                  for (w in pool) for (i in 0 until n) {
                      pf[i][w[i]] = (pf[i][w[i]] ?: 0) + 1
                      lf[w[i]] = (lf[w[i]] ?: 0) + 1
                  }
                  val tot = pool.size.toFloat()
                  val wg = if (mode == 1) 0.55f else 1.0f
                  val wn = if (mode == 1) 1.0f else 0.42f
                  return pool.sortedByDescending { w ->
                      var s = 0f
                      for (i in 0 until n) s += wg * ((pf[i][w[i]] ?: 0) / tot)
                      val seen = HashSet<Char>()
                      for (ch in w) {
                          if (!seen.add(ch)) continue
                          if (ch !in used) s += wn * ((lf[ch] ?: 0) / tot)
                      }
                      s
                  }
              }
          }
          EOF

